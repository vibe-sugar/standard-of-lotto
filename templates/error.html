{% extends "base.html" %}
{% block title %}오류 {{ code }} - 로또의 정석{% endblock %}

{% block content %}
<div class="container section">
  <div class="error-page">
    <div class="error-code" aria-hidden="true">{{ code }}</div>
    <h1 class="error-title">{{ message }}</h1>
    <p class="error-desc">
      {% if code == 404 %}
        요청하신 페이지를 찾을 수 없습니다. 주소를 다시 확인해 주세요.
      {% else %}
        일시적인 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.
      {% endif %}
    </p>
    <div class="error-actions">
      <a href="{{ url_for('index') }}" class="btn btn-primary">홈으로 이동</a>
      <button onclick="history.back()" class="btn btn-outline">이전 페이지</button>
    </div>
  </div>
</div>
{% endblock %}
